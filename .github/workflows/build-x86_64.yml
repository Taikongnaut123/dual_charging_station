# ============================================================================
#  CI：编译 x86_64（Linux / Ubuntu 22.04）
# ============================================================================
#
#  干什么：
#    1. 装 Qt5 与 ROS2 Humble
#    2. qmake 编界面程序，colcon 编 ROS2 桥（mdc_bridge + mdc_fake_pub）
#    3. 冒烟测试：无头启动界面 + 假设备全链路 + 下发 5 条控制指令
#    4. 打包成 tar.gz，上传到**滚动 Release**（tag 固定为 latest）
#
#  产物管理策略：
#    不做版本管理，同名文件直接覆盖 —— Releases 页面永远只有一份最新的，
#    下载地址固定不变。历史版本不保留。
#
#  同一个 push 会同时触发 build-arm64.yml，两个架构各出一份产物。
#  两份产物文件名不同，各覆盖各的。
#
#  为什么用 ubuntu-22.04：
#    与本项目本地开发环境（Qt 5.15.3 + ROS2 Humble）完全一致。
#    ROS2 Humble 官方只支持 22.04，所以这里不能用 24.04。
# ============================================================================
name: 构建 x86_64

on:
  push:
    branches: [master]
  workflow_dispatch:

# 两个架构都要往同一个 Release 里写，串行执行，避免同时改 Release 打架
concurrency:
  group: release-latest
  cancel-in-progress: false

permissions:
  contents: write

env:
  ROS_DISTRO: humble
  RELEASE_TAG: latest
  PKG_NAME: dual_charging_station-linux-x86_64

jobs:
  build:
    name: 编译 · 冒烟测试 · 发布
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: 取出源码
        uses: actions/checkout@v4

      - name: 显示构建环境
        run: |
          echo "运行器    : $RUNNER_NAME"
          echo "架构      : $(uname -m)"
          echo "系统      : $(. /etc/os-release && echo "$PRETTY_NAME")"
          echo "内核      : $(uname -r)"
          echo "CPU       : $(nproc) 核"
          echo "提交      : $GITHUB_SHA"
          echo "触发方式  : $GITHUB_EVENT_NAME"

      - name: 安装 Qt5 与图形依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            qtbase5-dev \
            qtbase5-dev-tools \
            qt5-qmake \
            qttools5-dev-tools \
            libgl1-mesa-dev \
            libgl1-mesa-dri \
            libegl1 \
            fonts-dejavu-core \
            file
          echo "Qt 版本：$(qmake -query QT_VERSION)"

      - name: 配置 ROS2 Humble 软件源
        run: |
          curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key -o /tmp/ros.key
          sudo mv /tmp/ros.key /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu $(. /etc/os-release && echo $UBUNTU_CODENAME) main" \
            | sudo tee /etc/apt/sources.list.d/ros2.list >/dev/null
          sudo apt-get update

      - name: 安装 ROS2 依赖
        run: |
          sudo apt-get install -y --no-install-recommends \
            ros-${ROS_DISTRO}-ros-base \
            ros-${ROS_DISTRO}-ament-cmake \
            ros-${ROS_DISTRO}-rosidl-default-generators \
            ros-${ROS_DISTRO}-rosidl-default-runtime \
            python3-colcon-common-extensions

      - name: 编译 Qt 界面程序（qmake）
        run: |
          set -euo pipefail
          mkdir -p build
          cd build
          qmake ../dual_charging_station.pro "CONFIG+=release" "CONFIG-=debug"
          make -j"$(nproc)"
          test -x dual_charging_station

      - name: 编译 ROS2 桥（colcon）
        run: |
          set -eo pipefail
          # ROS 的 setup.bash 第 8 行就引用了未定义变量 AMENT_TRACE_SETUP_FILES，
          # 开着 -u（nounset）去 source 它必然报 unbound variable 直接退出，
          # 所以只在 source 期间临时关掉 -u，source 完立刻恢复。
          set +u
          source /opt/ros/${ROS_DISTRO}/setup.bash
          set -u
          cd ros2_ws
          colcon build --symlink-install --event-handlers console_cohesion+

      - name: 校验产物架构与动态库
        run: |
          set -euo pipefail
          file build/dual_charging_station
          file build/dual_charging_station | grep -q 'x86-64' \
            || { echo "产物架构不对，期望 x86-64"; exit 1; }
          if ldd build/dual_charging_station | grep -q 'not found'; then
            echo "存在找不到的动态库："
            ldd build/dual_charging_station | grep 'not found'
            exit 1
          fi
          echo "架构与动态库检查通过"

      - name: 冒烟测试（无头启动 + 全链路 + 控制指令）
        run: |
          # ROS 环境由脚本自己 source（它内部也做了 set +u 处理，见脚本注释）
          bash tools/ci_smoke_test.sh

      - name: 出错时上传测试日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-x86_64
          path: build/ci-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: 打包
        run: bash tools/make_package.sh "${PKG_NAME}"

      - name: 校验产物能脱离本工程独立运行
        run: |
          set -euo pipefail
          STAGE="dist/${PKG_NAME}"
          # 关键：既不 source 本工程的 colcon overlay，也**不设 LD_LIBRARY_PATH**，
          # 完全靠二进制自带的 RPATH 去找 mdc_serial 的库 —— 这正是用户在目标机上
          # 直接敲 ./bin/chric_software_mdc_bridge 时的 真实情形。
          # 这里翻过两次车：先是打包漏了库；后来用了 DT_RUNPATH，而它对 dlopen
          # 无效，fastrtps 那几个运行时加载的库仍然找不到。
          APP_BIN="$STAGE/bin/chric_software_dual_charging_station" \
          BRIDGE_BIN="$STAGE/bin/chric_software_mdc_bridge" \
          FAKE_BIN="$STAGE/bin/chric_software_mdc_fake_pub" \
          OVERLAY_SETUP="" \
          bash tools/ci_smoke_test.sh

      - name: 发布到滚动 Release（覆盖同名产物）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          TRIGGER: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release [$RELEASE_TAG] 已存在，本次覆盖其中的同名产物"
          else
            echo "Release [$RELEASE_TAG] 不存在，创建"
            gh release create "$RELEASE_TAG" \
              --target "$COMMIT_SHA" \
              --title "最新构建（滚动覆盖）" \
              --notes "占位说明，下一步会覆盖成正式内容"
          fi

          gh release upload "$RELEASE_TAG" \
            "dist/${PKG_NAME}.tar.gz" \
            "dist/${PKG_NAME}.tar.gz.sha256" \
            --clobber

          {
            echo "本 Release 由 CI 自动覆盖更新：**永远只有最新一次**成功构建的产物，不保留历史版本。"
            echo
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 最近提交 | ${COMMIT_SHA} |"
            echo "| 触发方式 | ${TRIGGER} |"
            echo "| 来源分支 | ${GITHUB_REF_NAME} |"
            echo "| 更新时间 | $(date -u '+%Y-%m-%d %H:%M UTC') |"
            echo "| 本次覆盖 | ${PKG_NAME}.tar.gz |"
            echo "另一架构的产物不受本次影响，两份始终同时保留在本 Release 里。"
            echo
            echo "x86_64 与 arm64 两份产物分别由 build-x86_64.yml 与 build-arm64.yml 上传，各覆盖各的文件。"
            echo
            echo "用法：解包后进入目录， 直接执行 bin/chric_software_dual_charging_station --bridge-host 桥的IP。"
            echo "装了 ROS2 的机器上再跑 bin/chric_software_mdc_bridge；没有真机时用 bin/chric_software_mdc_fake_pub 验证整条链路。"
          } > /tmp/release-notes.md

          gh release edit "$RELEASE_TAG" \
            --title "最新构建（滚动覆盖，不做版本管理）" \
            --notes-file /tmp/release-notes.md

          echo
          echo "Release 产物列表："
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[] | "\(.name)\t\(.size) 字节"'
